<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تهيئة Bilal Smart Library</title><link rel="stylesheet" href="style.css"></head>
<body class="login-shell"><div class="login-glow glow-1"></div><div class="login-glow glow-2"></div><div class="login-card" style="max-width:520px"><div class="brand-mark">ب</div><div class="login-brand">Bilal Smart Library</div><h1>تهيئة أول مدير</h1><p>تُستخدم هذه الصفحة مرة واحدة لإنشاء أول حساب مدير على Supabase.</p>
<label>الاسم الكامل</label><input id="name" placeholder="مدير النظام"><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="admin@school.qa"><label>كلمة المرور</label><input id="password" type="password" placeholder="6 أحرف على الأقل"><label>رمز التهيئة</label><input id="token" placeholder="BILAL-..."><button class="btn primary wide" id="go">إنشاء حساب المدير</button><a class="btn ghost wide" href="index.html" style="text-decoration:none;text-align:center">العودة لتسجيل الدخول</a><div id="msg" class="login-note"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><script src="cloud-config.js"></script><script>
const c=window.BILAL_CLOUD, sb=window.supabase.createClient(c.url,c.publishableKey); document.getElementById('go').onclick=async()=>{const b=document.getElementById('go'),m=document.getElementById('msg');b.disabled=true;m.textContent='جارٍ إنشاء الحساب...';const {data,error}=await sb.functions.invoke('bootstrap-admin',{body:{fullName:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,token:document.getElementById('token').value.trim()}});b.disabled=false;if(error||!data?.ok){m.textContent=data?.message||error?.message||'تعذر إنشاء الحساب';return}m.textContent='تم إنشاء المدير بنجاح. يمكنك الآن تسجيل الدخول.';};
</script></body></html>
