name: Bilal Smart Library Keep-Alive

on:
  schedule:
    # Qatar is UTC+3: 03:00 UTC = 06:00 Qatar, 15:00 UTC = 18:00 Qatar.
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Ping Supabase through deployed app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep-alive endpoint
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://smartlibrary-one.vercel.app/api/keepalive"
          echo "Calling keep-alive endpoint at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 45 \
            "$ENDPOINT")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
          echo "Keep-alive completed successfully."
